services:
  db:
    image: pgvector/pgvector:pg16
    container_name: yinyuan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yinyuan
      POSTGRES_USER: yinyuan
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set_DB_PASSWORD_in_.env}
    ports:
      - "5432:5432"
    volumes:
      - yinyuan-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yinyuan -d yinyuan"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  yinyuan-db:
