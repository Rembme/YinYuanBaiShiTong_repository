server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: yinyuan-bai-shi-tong
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/yinyuan}
    username: ${DB_USERNAME:yinyuan}
    password: ${DB_PASSWORD:change-me-locally}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 30000
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 80MB
      max-request-size: 80MB
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET}
    ttl: ${JWT_TTL:PT12H}
  admin:
    username: ${APP_ADMIN_USERNAME:}
    password: ${APP_ADMIN_PASSWORD:}
    email: ${APP_ADMIN_EMAIL:}
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    connect-timeout: ${DEEPSEEK_TIMEOUT:PT20S}
  embedding:
    api-key: ${DASHSCOPE_API_KEY:}
    endpoint: ${DASHSCOPE_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}
    model: ${EMBEDDING_MODEL:text-embedding-v2}
    dimensions: 1536
  crawler:
    enabled: ${CRAWLER_ENABLED:false}
    max-links-per-source: ${CRAWLER_MAX_LINKS:24}
    timeout-ms: ${CRAWLER_TIMEOUT_MS:15000}
  mail:
    from: ${MAIL_FROM:}
  weekly:
    enabled: ${WEEKLY_REPORT_ENABLED:true}
logging:
  level:
    root: INFO
    cn.bigc.yinyuan: INFO
